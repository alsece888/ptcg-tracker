<title>MALO-TCG 战绩</title>
<style>
:root,
[data-theme="light"] {
  --bg-deco-1: radial-gradient(circle at 70% 15%, rgba(12,175,123,0.22) 0%, transparent 65%);
  --bg-deco-2: radial-gradient(circle at 15% 85%, rgba(233,69,96,0.18) 0%, transparent 60%);
  --bg-deco-3: radial-gradient(circle at 85% 55%, rgba(59,109,233,0.12) 0%, transparent 55%);
  --glass: rgba(255,255,255,0.42);
  --glass-hover: rgba(255,255,255,0.55);
  --glass-strong: rgba(255,255,255,0.35);
  --glass-edge: rgba(255,255,255,0.25);
  --text: #1a1d23;
  --text-2: #5f6672;
  --text-3: #939aa5;
  --accent: #0caf7b;
  --accent-glow: rgba(12,175,123,0.35);
  --accent-bg: rgba(12,175,123,0.1);
  --danger: #e5534b;
  --danger-glow: rgba(229,83,75,0.3);
  --danger-bg: rgba(229,83,75,0.1);
  --divider: rgba(0,0,0,0.06);
  --bg-card: #ffffff;
  --bg-input: #f0f2f5;
  --border: #e1e4e8;
  --info: #3b6de9;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
  --blur: blur(20px);
  --blur-heavy: blur(28px);
}
[data-theme="dark"] {
  --bg-deco-1: radial-gradient(circle at 70% 15%, rgba(78,204,163,0.18) 0%, transparent 65%);
  --bg-deco-2: radial-gradient(circle at 15% 85%, rgba(233,69,96,0.14) 0%, transparent 60%);
  --bg-deco-3: radial-gradient(circle at 85% 55%, rgba(59,109,233,0.1) 0%, transparent 55%);
  --glass: rgba(23,27,35,0.45);
  --glass-hover: rgba(23,27,35,0.58);
  --glass-strong: rgba(23,27,35,0.38);
  --glass-edge: rgba(255,255,255,0.06);
  --text: #e1e4e8;
  --text-2: #8b929a;
  --text-3: #5c6270;
  --accent: #4ecca3;
  --accent-glow: rgba(78,204,163,0.3);
  --accent-bg: rgba(78,204,163,0.1);
  --danger: #e5534b;
  --danger-glow: rgba(229,83,75,0.25);
  --danger-bg: rgba(229,83,75,0.1);
  --divider: rgba(255,255,255,0.05);
  --bg-card: #171a21;
  --bg-input: #1a1d25;
  --border: #2a2d38;
  --info: #5b8def;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
  --blur: blur(20px);
  --blur-heavy: blur(28px);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
  min-width: 300px;
  overflow-y: auto;
  overflow-x: hidden;
  max-height: 100vh;
  /* No padding — content fills window edge-to-edge */
  padding: 0;
  position: relative;
  background: transparent;
}

/* ===== Background Decoration Layer ===== */
.bg-deco {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-deco .blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
}
.bg-blob-1 {
  width: 220px; height: 220px;
  top: -40px; right: -60px;
  background: var(--bg-deco-1);
}
.bg-blob-2 {
  width: 200px; height: 200px;
  bottom: -50px; left: -50px;
  background: var(--bg-deco-2);
}
.bg-blob-3 {
  width: 140px; height: 140px;
  top: 40%; right: -30px;
  background: var(--bg-deco-3);
}

/* ===== Content Layer ===== */
.content-layer {
  position: relative;
  z-index: 1;
  padding: 10px 12px 8px;
}

/* ===== Glass Panel Mixin ===== */
.glass-panel {
  background: var(--glass);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-radius: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.06), inset 0 0 0 0.5px var(--glass-edge);
}

/* ===== Header ===== */
.p-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
}
.p-logo-row { display: flex; align-items: center; gap: 6px; }
.p-logo { height: 18px; width: auto; opacity: 0.85; }
.p-logo-text { font-size: 12px; font-weight: 700; color: var(--text-2); letter-spacing: 0.3px; }
.p-btn-refresh {
  width: 30px; height: 30px;
  border: none;
  border-radius: 50%;
  background: var(--glass-strong);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: var(--text-2);
  box-shadow: inset 0 0 0 0.5px var(--glass-edge);
}
.p-btn-refresh:hover { color: var(--accent); transform: scale(1.08); box-shadow: 0 2px 12px var(--accent-glow); }
.p-btn-refresh:active { transform: scale(0.92); }

/* ===== Gauge Section ===== */
.gauge-section {
  display: flex;
  justify-content: center;
  padding: 6px;
}
.gauge {
  position: relative;
  width: 70px; height: 70px;
}
.gauge-ring {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: var(--glass-strong);
  backdrop-filter: var(--blur-heavy);
  -webkit-backdrop-filter: var(--blur-heavy);
  box-shadow: inset 0 0 0 0.5px var(--glass-edge);
}
.gauge-svg-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gauge-svg { transform: rotate(-90deg); width: 54px; height: 54px; }
.gauge-bg {
  fill: none;
  stroke: var(--divider);
  stroke-width: 6;
}
.gauge-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  filter: drop-shadow(0 0 6px var(--accent-glow));
}
.gauge-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.gauge-pct {
  font-size: 17px;
  font-weight: 800;
  font-family: var(--mono);
  line-height: 1;
  color: var(--text);
}
.gauge-label {
  font-size: 9px;
  color: var(--text-3);
  font-weight: 600;
  margin-top: 1px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===== Deck Selector ===== */
.deck-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 3px 3px 14px;
}
.deck-icon { font-size: 15px; flex-shrink: 0; }
.deck-select {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  font-family: var(--font);
  cursor: pointer;
  padding: 9px 0;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.deck-arrow { font-size: 10px; color: var(--text-3); margin-right: 10px; pointer-events: none; }

/* ===== Win / Loss ===== */
.wl-row { display: flex; gap: 8px; padding: 0 14px 4px; }
.wl-card {
  flex: 1;
  border-radius: 10px;
  padding: 8px 6px;
  text-align: center;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  transition: transform 0.2s, box-shadow 0.2s;
}
.wl-card:hover { transform: translateY(-2px); }
.wl-card.win {
  background: var(--accent-bg);
  box-shadow: inset 0 0 0 0.5px rgba(12,175,123,0.2);
}
.wl-card.win:hover { box-shadow: 0 4px 16px var(--accent-glow), inset 0 0 0 0.5px rgba(12,175,123,0.25); }
.wl-card.lose {
  background: var(--danger-bg);
  box-shadow: inset 0 0 0 0.5px rgba(229,83,75,0.18);
}
.wl-card.lose:hover { box-shadow: 0 4px 16px var(--danger-glow), inset 0 0 0 0.5px rgba(229,83,75,0.22); }
.wl-card .wl-icon { font-size: 12px; margin-bottom: 1px; }
.wl-card .wl-num {
  font-size: 18px;
  font-weight: 800;
  font-family: var(--mono);
  line-height: 1.1;
}
.wl-card.win .wl-num { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }
.wl-card.lose .wl-num { color: var(--danger); text-shadow: 0 0 8px var(--danger-glow); }
.wl-card .wl-label { font-size: 9px; color: var(--text-2); font-weight: 600; }

/* ===== Stats Panel (compact horizontal) ===== */
.stats-panel { padding: 8px 10px; margin-bottom: 8px; }
.stats-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.stats-row .gauge-section {
  padding: 0;
  flex-shrink: 0;
}
.stats-row .wl-row {
  padding: 0;
  flex: 0 0 auto;
  width: 100px;
}
.stats-row .wl-card {
  padding: 6px 4px;
}
.stats-panel .total-badge {
  padding: 4px 0 0;
}
.total-badge {
  text-align: center;
  padding: 0 0 4px;
}
.total-badge span {
  display: inline-block;
  background: var(--glass-strong);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-radius: 20px;
  padding: 3px 12px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-2);
  font-family: var(--mono);
  box-shadow: inset 0 0 0 0.5px var(--glass-edge);
}

/* ===== API Mini ===== */
.api-mini {
  padding: 10px 14px;
  display: flex;
  justify-content: space-around;
  text-align: center;
}
.api-mini-item .ami-val {
  font-size: 14px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--text);
}
.api-mini-item .ami-lbl { font-size: 10px; color: var(--text-3); margin-top: 1px; }
.api-mini-divider { width: 1px; background: var(--divider); }

/* ===== 快速记录 ===== */
.quick-record { padding: 9px 12px; }
.qr-row { display: flex; align-items: center; gap: 6px; }
.qr-row + .qr-row { margin-top: 7px; }
.qr-row .hist-turn { display: inline-flex; gap: 3px; flex-shrink: 0; }
.qr-opp { flex: 1; min-width: 0; }
.qr-btn {
  flex: 1;
  border: none;
  border-radius: 9px;
  padding: 8px 0;
  font-size: 14px;
  font-weight: 800;
  font-family: var(--font);
  color: #fff;
  cursor: pointer;
  transition: transform 0.12s, filter 0.12s;
}
.qr-btn.win { background: var(--accent); box-shadow: 0 3px 12px var(--accent-glow); }
.qr-btn.loss { background: var(--danger); box-shadow: 0 3px 12px var(--danger-glow); }
.qr-btn:hover { filter: brightness(1.08); }
.qr-btn:active { transform: scale(0.97); }
.qr-hint {
  font-size: 10px;
  color: var(--text-3);
  font-family: var(--mono);
  text-align: center;
  padding-top: 5px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== History ===== */
.history-section { padding: 10px 14px; }
.history-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.history-list { max-height: 130px; overflow-y: auto; }
.history-list::-webkit-scrollbar { width: 3px; }
.history-list::-webkit-scrollbar-track { background: transparent; }
.history-list::-webkit-scrollbar-thumb { background: var(--text-3); border-radius: 3px; }
.hist-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  border-radius: 8px;
  margin-bottom: 3px;
  background: var(--glass-strong);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}
.hist-item:last-child { margin-bottom: 0; }
.hist-left { display: flex; align-items: center; gap: 4px; min-width: 0; flex-wrap: wrap; }
.hist-deck-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.hist-deck-dot.win { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.hist-deck-dot.lose { background: var(--danger); box-shadow: 0 0 6px var(--danger-glow); }
.hist-deck-dot.neutral { background: var(--text-3); }
.hist-deck-name {
  font-size: 11px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60px;
  flex-shrink: 1; min-width: 0;
}
.hist-delta { font-size: 11px; font-family: var(--mono); white-space: nowrap; display: flex; gap: 3px; flex-shrink: 0; }
.hist-delta .dw { color: var(--accent); font-weight: 700; }
.hist-delta .dl { color: var(--danger); font-weight: 700; }
.hist-turn { display: inline-flex; gap: 2px; align-items: center; flex-shrink: 0; }
.hist-btn-turn {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.hist-btn-turn:hover { border-color: var(--accent); color: var(--accent); }
.hist-btn-turn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.hist-btn-turn.active.second {
  background: var(--info);
  border-color: var(--info);
}
.hist-btn-turn.gray {
  background: var(--bg-input);
  color: var(--text-3);
  border-color: var(--border);
}
.hist-btn-turn.gray:hover { border-color: var(--accent); color: var(--accent); }
.hist-sep { color: var(--text-3); }
.hist-opp {
  font-size: 10px;
  color: #3b6de9;
  background: rgba(59,109,233,0.1);
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
  min-width: 0;
}
.hist-opp:hover { background: rgba(59,109,233,0.18); }
[data-theme="dark"] .hist-opp { color: #5b8def; }
.pop-deck-icons {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-right: 3px;
  vertical-align: middle;
}
.pop-deck-icon {
  width: 16px;
  height: 16px;
  object-fit: contain;
  display: inline-block;
  vertical-align: middle;
}
.hist-opp-placeholder {
  font-size: 10px;
  color: var(--text-3);
  background: transparent;
  border: 1px dashed var(--text-3);
  padding: 1px 5px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  flex-shrink: 0;
}
.hist-opp-placeholder:hover { color: #3b6de9; border-color: #3b6de9; }
.hist-opp-select {
  font-size: 10px;
  background: var(--glass-strong);
  border: 1px solid var(--glass-edge);
  border-radius: 3px;
  padding: 2px 4px;
  color: var(--text);
  font-family: var(--font);
  cursor: pointer;
  max-width: 100px;
  outline: none;
}
.hist-opp-select:focus { border-color: #3b6de9; }
.hist-opp-select option { font-size: 10px; }
.hist-right-row {
  display: flex;
  align-items: center;
  gap: 3px;
}
.hist-btn-mini {
  width: 18px; height: 18px;
  border: none;
  border-radius: 3px;
  background: var(--glass-strong);
  cursor: pointer;
  font-size: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  padding: 0;
  transition: all 0.15s;
}
.hist-btn-mini:hover { color: var(--accent); }
.hist-btn-mini.cancel:hover { color: var(--danger); }
.hist-btn-mini.on {
  background: var(--accent-bg);
  color: var(--accent);
  font-weight: 800;
}
.hist-time { font-size: 10px; color: var(--text-3); font-family: var(--mono); flex-shrink: 0; margin-left: 4px; }
.hist-empty { text-align: center; padding: 14px 8px; color: var(--text-3); font-size: 11px; }

/* ===== Status ===== */
.p-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 10px;
  color: var(--text-3);
  padding: 6px 0 4px;
}
.p-status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
}
.p-status-dot.stale { background: var(--text-3); box-shadow: none; }

/* ===== Empty ===== */
.empty-state {
  text-align: center;
  padding: 60px 16px;
  color: var(--text-3);
  font-size: 13px;
  position: relative;
  z-index: 1;
}
.empty-icon { font-size: 42px; margin-bottom: 10px; opacity: 0.45; }

/* ===== Scrollbar ===== */
body::-webkit-scrollbar { width: 4px; }
body::-webkit-scrollbar-track { background: transparent; }
body::-webkit-scrollbar-thumb { background: var(--text-3); border-radius: 4px; }

/* Compact match desk */
:root, [data-theme="light"] { --popup-bg: #f3f4f1; }
[data-theme="dark"] { --popup-bg: #11171d; }
body { background: var(--popup-bg); }
.bg-deco { display: none; }
.content-layer { display: flex; flex-direction: column; gap: 8px; padding: 9px; width: 100%; max-width: 100vw; }
.glass-panel {
  margin: 0; background: var(--bg-card); backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid var(--border); border-radius: 13px; min-width: 0; max-width: 100%;
  box-shadow: 0 5px 18px rgba(0, 0, 0, .055);
}
.p-header { order: 0; padding: 10px 13px; }
.p-logo-text { font-size: 13px; color: var(--text); }
.deck-row { order: 1; gap: 9px; padding: 11px 13px; }
.deck-icon, .deck-arrow { display: none; }
.deck-row-label { flex: 0 0 auto; font-size: 12px; color: var(--text-2); font-weight: 700; }
.deck-row .deck-select { min-width: 0; font-weight: 700; }
.quick-record { order: 2; border-left: 4px solid var(--accent); padding: 14px; }
.quick-record .qr-row { min-width: 0; }
.quick-record .qr-btn { min-width: 0; }
.pop-section-label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 15px; font-weight: 800; color: var(--text); }
.pop-section-label span { font-size: 10px; font-weight: 500; color: var(--text-3); }
.quick-record .qr-row + .qr-row { margin-top: 11px; }
.qr-btn { min-height: 48px; font-size: 20px; font-weight: 800; border-radius: 10px; }
.stats-panel { order: 3; padding: 10px 13px; }
.stats-panel::before { content: '当前卡组表现'; display: block; color: var(--text-2); font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.history-section { order: 4; padding: 12px 13px; }
.history-title { font-size: 12px; font-weight: 800; margin-bottom: 8px; }
.history-list { max-height: 195px; overflow-y: auto; }
.api-mini { order: 5; }
.p-status { order: 6; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
</style>
</head>
<body>
<!-- VERSION: 2026-07-23-v4 (compact stats) -->

<!-- Background decorative blobs (blurred by glass panels above) -->
<div class="bg-deco">
  <div class="blob bg-blob-1"></div>
  <div class="blob bg-blob-2"></div>
  <div class="blob bg-blob-3"></div>
</div>

<!-- Content -->
<div id="noPlayer" class="empty-state">
  <div class="empty-icon">🃏</div>
  <p>请先在主页面<br>设置昵称和卡组</p>
</div>

<div id="content" class="content-layer" style="display:none;">

  <!-- Header -->
  <div class="glass-panel p-header">
    <div class="p-logo-row">
      <img src="malo-tcg-logo.png" alt="MALO-TCG" class="p-logo">
      <span class="p-logo-text">战绩追踪</span>
    </div>
    <button class="p-btn-refresh" onclick="requestRefresh()" title="刷新排位数据（只读，不会改对局记录）">🔄</button>
  </div>

  <!-- Stats -->
  <div class="glass-panel stats-panel">
    <div class="stats-row">
      <div class="gauge-section">
        <div class="gauge">
          <div class="gauge-ring"></div>
          <div class="gauge-svg-wrap">
            <svg class="gauge-svg" viewBox="0 0 90 90">
              <circle class="gauge-bg" cx="45" cy="45" r="38"/>
              <circle class="gauge-fill" id="gFill" cx="45" cy="45" r="38"
                stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
            </svg>
          </div>
          <div class="gauge-text">
            <div class="gauge-pct" id="gPct">--</div>
            <div class="gauge-label">胜率</div>
          </div>
        </div>
      </div>
      <div class="wl-row">
        <div class="wl-card win">
          <div class="wl-icon">⚔</div>
          <div class="wl-num" id="deckWins">0</div>
          <div class="wl-label">胜</div>
        </div>
        <div class="wl-card lose">
          <div class="wl-icon">💀</div>
          <div class="wl-num" id="deckLosses">0</div>
          <div class="wl-label">负</div>
        </div>
      </div>
    </div>
    <div class="total-badge"><span id="deckTotal">合计 0 场</span></div>
  </div>

  <!-- Deck -->
  <div class="glass-panel deck-row">
    <span class="deck-row-label">使用卡组</span>
    <span class="deck-icon">🃏</span>
    <select id="deckSel" class="deck-select"></select>
    <span class="deck-arrow">▾</span>
  </div>

  <!-- 快速记录：打完一局点一下「胜」或「负」 -->
  <div class="glass-panel quick-record">
    <div class="pop-section-label">快速记一局 <span>选择先后手和对手，再记结果</span></div>
    <div class="qr-row">
      <span class="hist-turn">
        <button class="hist-btn-turn" id="qrTurnFirst" onclick="popSetTurn('first')" title="先手（再点一次取消）">先</button>
        <button class="hist-btn-turn second" id="qrTurnSecond" onclick="popSetTurn('second')" title="后手（再点一次取消）">后</button>
      </span>
      <select class="hist-opp-select qr-opp" id="qrOpp" onchange="popSetOpp(this.value)" title="对手卡组，可留空"></select>
    </div>
    <div class="qr-row">
      <button class="qr-btn win" onclick="popRecordMatch('win')">胜</button>
      <button class="qr-btn loss" onclick="popRecordMatch('loss')">负</button>
    </div>
    <span class="qr-hint" id="qrHint"></span>
  </div>

  <!-- API -->
  <div class="glass-panel api-mini" id="apiMini" style="display:none;">
    <div class="api-mini-item"><div class="ami-val" id="apiRank">--</div><div class="ami-lbl">排名</div></div>
    <div class="api-mini-divider"></div>
    <div class="api-mini-item"><div class="ami-val" id="apiExp">--</div><div class="ami-lbl">积分</div></div>
    <div class="api-mini-divider"></div>
    <div class="api-mini-item"><div class="ami-val" id="apiTotal">--</div><div class="ami-lbl">总场</div></div>
  </div>

  <!-- History -->
  <div class="glass-panel history-section" id="historySection">
    <div class="history-title">📋 对局历史</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Status -->
  <div class="p-status">
    <span class="p-status-dot" id="stDot"></span>
    <span id="stText">就绪</span>
    <span id="stTime" style="margin-left:4px;"></span>
  </div>
</div>

<script src="store.js?v=2"></script>
<script>
var STORAGE_KEY = 'ptcg-tracker-data';
var channel = new BroadcastChannel('ptcg-sync');
var CIRCUMFERENCE = 2 * Math.PI * 38;
var data = null;

// 存储层（store.js）负责「读最新 → 合并 → 写回」，避免悬浮窗把主页面刚写的记录整份覆盖掉
function readStore() {
  if (window.PtcgStore) return PtcgStore.read();
  try { var r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}

function loadData() {
  data = readStore();
}
function freshData() {
  return readStore();
}
// 读-改-写：保存前总是读取 localStorage 最新数据并做合并，避免用旧快照覆盖其他窗口的新记录
function commitData(mutator) {
  if (window.PtcgStore) {
    var merged = PtcgStore.mutate(function (fresh) { mutator(fresh); return fresh; });
    data = merged;
    channel.postMessage({ type: 'data-updated' });
    render();
    return;
  }
  var fresh = freshData();
  if (!fresh) fresh = { personal: { matchHistory: [], draftMatch: null } };
  if (!fresh.personal) fresh.personal = { matchHistory: [], draftMatch: null };
  if (!fresh.personal.matchHistory) fresh.personal.matchHistory = [];
  mutator(fresh);
  data = fresh;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
  channel.postMessage({ type: 'data-updated' });
  render();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function byId(id) { return document.getElementById(id); }

// ===== 对局记录口径：卡组战绩 = 该卡组所有记录的胜负合计（记录是唯一事实来源） =====
function popUuid() { return 'xxxx-xxxx-xxxx'.replace(/x/g, function(){ return (Math.random()*16|0).toString(16); }); }
function popEntryWins(e) {
  if (!e) return 0;
  if (e.deltaWins) return e.deltaWins;
  return (e.result === 'win' || e.result === '胜') ? 1 : 0;
}
function popEntryLosses(e) {
  if (!e) return 0;
  if (e.deltaLosses) return e.deltaLosses;
  return (e.result === 'loss' || e.result === '负') ? 1 : 0;
}
function popResultOf(e) {
  var w = popEntryWins(e), l = popEntryLosses(e);
  if (w > 0 && w >= l) return 'win';
  if (l > 0 && l >= w) return 'loss';
  return null;
}
function popTotalsFor(p, deckId) {
  var t = { wins: 0, losses: 0, total: 0 };
  ((p && p.matchHistory) || []).forEach(function(e) {
    if (!e || e.deckId !== deckId) return;
    t.wins += popEntryWins(e);
    t.losses += popEntryLosses(e);
  });
  t.total = t.wins + t.losses;
  return t;
}
// 记录卡表单（沿用 draftMatch 字段，和网页端共用同一份）
function popForm(p) {
  if (!p.draftMatch || typeof p.draftMatch !== 'object') p.draftMatch = { deckId: null, firstMove: null, opponentDeck: '' };
  if (p.draftMatch.firstMove === undefined) p.draftMatch.firstMove = null;
  if (p.draftMatch.opponentDeck === undefined) p.draftMatch.opponentDeck = '';
  return p.draftMatch;
}

function render() {
  // 如果正在编辑对手，不要重新加载 localStorage，避免丢失临时编辑状态
  var editing = data && data.personal && data.personal.matchHistory && data.personal.matchHistory.some(function(h){ return h._editingOpp; });
  if (!editing) {
    loadData();
  }
  var p = data && data.personal;
  var hasPlayer = p && p.playerName;
  var decks = (p && p.decks) || {};
  var deckIds = Object.keys(decks);
  var curId = (p && p.currentDeckId && decks[p.currentDeckId]) ? p.currentDeckId : (deckIds[0] || null);

  if (!hasPlayer || deckIds.length === 0) {
    byId('noPlayer').style.display = 'block';
    byId('content').style.display = 'none';
    return;
  }
  byId('noPlayer').style.display = 'none';
  byId('content').style.display = 'flex';

  var sel = byId('deckSel');
  sel.innerHTML = deckIds.map(function(id) {
    return '<option value="' + id + '"' + (id === curId ? ' selected' : '') + '>' + esc(decks[id].name) + '</option>';
  }).join('');
  sel.value = curId || '';

  // 战绩 = 这个卡组的对局记录合计
  var t = popTotalsFor(p, curId);
  var total = t.total;
  var wr = total > 0 ? (t.wins / total * 100) : 0;

  byId('gFill').setAttribute('stroke-dashoffset', CIRCUMFERENCE * (1 - wr / 100));
  byId('gPct').textContent = total > 0 ? wr.toFixed(1) + '%' : '--';
  byId('deckWins').textContent = t.wins;
  byId('deckLosses').textContent = t.losses;
  byId('deckTotal').textContent = '合计 ' + total + ' 场';

  var pd = data && data.players && data.players[p.playerName];
  if (pd && pd.winTotal !== null && pd.loseTotal !== null) {
    byId('apiMini').style.display = 'flex';
    byId('apiRank').textContent = pd.rank ? '#' + pd.rank : '--';
    byId('apiExp').textContent = pd.exp !== null ? pd.exp : '--';
    byId('apiTotal').textContent = (pd.winTotal + pd.loseTotal);
  } else { byId('apiMini').style.display = 'none'; }

  renderHistory();
  renderQuickRecord(p);
  renderStatus();
}

// 快速记录面板：先后手 / 对手 / 记到哪个卡组
function renderQuickRecord(p) {
  var form = popForm(p);
  var deckId = (form.deckId && p.decks && p.decks[form.deckId]) ? form.deckId : p.currentDeckId;
  var deck = (p.decks || {})[deckId] || null;

  byId('qrTurnFirst').className = 'hist-btn-turn' + (form.firstMove === 'first' ? ' active' : '');
  byId('qrTurnSecond').className = 'hist-btn-turn second' + (form.firstMove === 'second' ? ' active second' : '');

  var opp = form.opponentDeck || '';
  var sel = byId('qrOpp');
  sel.innerHTML = '<option value="">' + (opp ? '-- 清空对手 --' : '+ 对手卡组') + '</option>' +
    ((p.deckList || []).map(function(dl) {
      return '<option value="' + esc(dl.name) + '"' + (dl.name === opp ? ' selected' : '') + '>' + esc(dl.name) + '</option>';
    }).join(''));
  sel.value = opp;

  var t2 = deck ? popTotalsFor(p, deckId) : { wins: 0, losses: 0 };
  byId('qrHint').textContent = deck
    ? ('记到 ' + deck.name + ' · 现 ' + t2.wins + '胜 ' + t2.losses + '败')
    : '还没有卡组，先在网页端创建一个';
}

function renderPopDeckIcons(ids) {
  if (!ids || ids.length === 0) return '';
  return '<span class="pop-deck-icons">' + ids.map(function(id) {
    return '<img src="https://tcg.mik.moe/static/icon/' + esc(id) + '.png" class="pop-deck-icon" alt="">';
  }).join('') + '</span>';
}

function renderHistory() {
  var h = ((data && data.personal) ? data.personal.matchHistory : null) || [];
  var deckList = (data && data.personal && data.personal.deckList) ? data.personal.deckList : [];
  var c = byId('historyList');

  if (h.length === 0) { c.innerHTML = '<div class="hist-empty">暂无记录 · 在上方点「胜」或「负」记一场</div>'; return; }
  var items = h.slice(-10).reverse();
  c.innerHTML = items.map(function(x) {
    var d = x.time ? new Date(x.time) : new Date();
    var ts = (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    var res = popResultOf(x);
    var dc = res === 'win' ? 'win' : (res === 'loss' ? 'lose' : 'neutral');
    var delta = res === 'win' ? '<span class="dw">胜</span>'
      : (res === 'loss' ? '<span class="dl">负</span>' : '<span style="color:var(--text-3)">未知</span>');
    var opp = x.opponentDeck || '';
    var deckEntry = opp ? deckList.find(function(dl){ return dl.name===opp; }) : null;
    var oppIcons = deckEntry && deckEntry.icons ? renderPopDeckIcons(deckEntry.icons) : '';

    var oppHtml = '';
    if (x._editingOpp) {
      var opts = deckList.map(function(dl){
        var sel = dl.name===opp ? ' selected' : '';
        return '<option value="'+esc(dl.name)+'"'+sel+'>'+esc(dl.name)+'</option>';
      }).join('');
      oppHtml = '<div class="hist-right-row">'+
        '<button class="hist-btn-mini'+(res==='win'?' on':'')+'" data-res-id="'+esc(x.id)+'" data-res="win" title="改成胜">胜</button>'+
        '<button class="hist-btn-mini'+(res==='loss'?' on':'')+'" data-res-id="'+esc(x.id)+'" data-res="loss" title="改成负">负</button>'+
        '<select class="hist-opp-select" data-id="'+esc(x.id)+'"><option value="">--</option>'+opts+'</select>'+
        '<button class="hist-btn-mini cancel" data-cancel="'+esc(x.id)+'" title="取消">✕</button>'+
        '<button class="hist-btn-mini cancel" data-del="'+esc(x.id)+'" title="删除这条记录">🗑</button></div>';
    } else if (opp) {
      oppHtml = '<span class="hist-opp" data-id="'+esc(x.id)+'" title="点击修改对手/胜负">'+oppIcons+' vs '+esc(opp)+'</span>';
    } else {
      oppHtml = '<span class="hist-opp-placeholder" data-id="'+esc(x.id)+'" title="点击修改对手/胜负">+ 对手</span>';
    }

    var turnHtml = renderPopTurn(x.id, x.firstMove);

    return '<div class="hist-item"><div class="hist-left"><span class="hist-deck-dot '+dc+'"></span><span class="hist-deck-name" title="'+esc(x.deckName||'')+'">'+esc(x.deckName||'')+'</span><span class="hist-turn">'+turnHtml+'</span><span class="hist-delta" data-opp-id="'+esc(x.id)+'" title="点击修改">'+delta+'</span>'+oppHtml+'</div><span class="hist-time">'+ts+'</span></div>';
  }).join('');
}

function renderPopTurn(id, firstMove) {
  if (!data || !data.personal || !data.personal.matchHistory) return '';
  var editing = data.personal.matchHistory.find(function(h){ return h.id===id && h._editingTurn; });
  if (editing) {
    return '<button class="hist-btn-turn '+ (firstMove==='first'?'active':'gray') +'" data-turn-id="'+esc(id)+'" data-turn="first">先</button>'+
           '<button class="hist-btn-turn '+ (firstMove==='second'?'active second':'gray') +'" data-turn-id="'+esc(id)+'" data-turn="second">后</button>';
  }
  if (firstMove === 'first') {
    return '<button class="hist-btn-turn active" data-turn-id="'+esc(id)+'">先</button>';
  }
  if (firstMove === 'second') {
    return '<button class="hist-btn-turn active second" data-turn-id="'+esc(id)+'">后</button>';
  }
  return '<button class="hist-btn-turn" data-turn-id="'+esc(id)+'" data-turn="first">先</button>'+
         '<button class="hist-btn-turn second" data-turn-id="'+esc(id)+'" data-turn="second">后</button>';
}

function editPopTurn(id) {
  if (!data || !data.personal || !data.personal.matchHistory) return;
  data.personal.matchHistory.forEach(function(h) { delete h._editingTurn; });
  var entry = data.personal.matchHistory.find(function(h){ return h.id===id; });
  if (entry) entry._editingTurn = true;
  render();
}

function savePopTurn(id, turn) {
  commitData(function(fresh) {
    (fresh.personal.matchHistory || []).forEach(function(h) { delete h._editingTurn; });
    var entry = fresh.personal.matchHistory.find(function(h){ return h.id===id; });
    if (entry) entry.firstMove = turn;
  });
}

function editPopOpp(id) {
  if (!data || !data.personal || !data.personal.matchHistory) return;
  data.personal.matchHistory.forEach(function(h) { delete h._editingOpp; });
  var entry = data.personal.matchHistory.find(function(h){ return h.id===id; });
  if (entry) entry._editingOpp = true;
  render();
}

function cancelPopOpp() {
  if (!data || !data.personal || !data.personal.matchHistory) return;
  data.personal.matchHistory.forEach(function(h) { delete h._editingOpp; });
  render();
}

function savePopOpp(id, val) {
  if (val === undefined) {
    var sel = document.querySelector('.hist-opp-select[data-id="'+id+'"]');
    if (!sel) { cancelPopOpp(); return; }
    val = sel.value;
  }
  commitData(function(fresh) {
    (fresh.personal.matchHistory || []).forEach(function(h) { delete h._editingOpp; });
    var entry = fresh.personal.matchHistory.find(function(h){ return h.id===id; });
    if (entry) {
      if (val) { entry.opponentDeck = val; }
      else { delete entry.opponentDeck; }
    }
  });
}

// ============================================================
// 快速记录（悬浮窗版）
// ============================================================

function popSetTurn(turn) {
  commitData(function(fresh) {
    var f = popForm(fresh.personal);
    f.firstMove = f.firstMove === turn ? null : turn; // 再点一次＝取消
  });
}

function popSetOpp(val) {
  commitData(function(fresh) { popForm(fresh.personal).opponentDeck = val || ''; });
}

function popSetResult(id, result) {
  commitData(function(fresh) {
    var entry = (fresh.personal.matchHistory || []).find(function(h){ return h.id === id; });
    if (!entry || popResultOf(entry) === result) return;
    entry.deltaWins = result === 'win' ? 1 : 0;
    entry.deltaLosses = result === 'loss' ? 1 : 0;
    entry.result = result;
  });
}

function popDeleteEntry(id) {
  if (!confirm('删除这条记录吗？')) return;
  commitData(function(fresh) {
    var p = fresh.personal;
    p.matchHistory = (p.matchHistory || []).filter(function(h){ return h.id !== id; });
    // 墓碑：另一个还开着的窗口用旧快照保存时不会把这条带回来
    if (!p.historyTombstones) p.historyTombstones = {};
    p.historyTombstones[id] = Date.now();
  });
}

// 打完一局点一下「胜」/「负」：记到当前卡组，带上选好的先后手和对手
function popRecordMatch(result) {
  var recorded = '';
  commitData(function(fresh) {
    var p = fresh.personal;
    var deckId = p.currentDeckId;
    var deck = deckId ? (p.decks || {})[deckId] : null;
    if (!deck) return;
    var f = popForm(p);
    var entry = {
      id: popUuid(),
      deckId: deckId,
      deckName: deck.name,
      deltaWins: result === 'win' ? 1 : 0,
      deltaLosses: result === 'loss' ? 1 : 0,
      result: result,
      manual: true,
      time: new Date().toISOString(),
    };
    if (f.firstMove) entry.firstMove = f.firstMove;
    if (f.opponentDeck) entry.opponentDeck = f.opponentDeck;
    if (!p.matchHistory) p.matchHistory = [];
    p.matchHistory.push(entry);
    f.opponentDeck = ''; // 对手每局都不同，记完清掉；先后手保留
    recorded = deck.name + ' ' + (result === 'win' ? '胜' : '负');
  });
  var hint = byId('qrHint');
  if (hint && recorded) hint.textContent = '✓ 已记录 ' + recorded;
  else if (hint && !recorded) hint.textContent = '还没有卡组，先在网页端创建一个';
}

function renderStatus() {
  var lu = data && data.lastUpdate;
  var dot = byId('stDot'), tx = byId('stText'), tm = byId('stTime');
  if (lu) {
    var d = new Date(lu);
    tm.textContent = '· ' + (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    var fresh = Date.now() - d.getTime() < 10*60*1000;
    dot.className = fresh ? 'p-status-dot' : 'p-status-dot stale';
    tx.textContent = fresh ? '已同步' : '数据较旧';
  } else { dot.className = 'p-status-dot stale'; tx.textContent = '暂无数据'; tm.textContent = ''; }
}

byId('deckSel').addEventListener('change', function() {
  var nid = this.value;
  if (!nid) return;
  commitData(function(fresh) {
    var p = fresh.personal || {};
    if (nid === p.currentDeckId) return;
    p.currentDeckId = nid;
    popForm(p).deckId = nid; // 记录卡跟着切，避免记到别的卡组上
  });
  channel.postMessage({ type: 'deck-changed', deckId: nid });
});

window.addEventListener('storage', function(e) { if (e.key===STORAGE_KEY) { loadData(); render(); } });
channel.addEventListener('message', function(e) {
  if (e.data && (e.data.type==='data-updated'||e.data.type==='deck-changed')) { loadData(); render(); }
});

function requestRefresh() {
  channel.postMessage({ type: 'refresh-request' });
  byId('stText').textContent = '刷新中...';
  setTimeout(function() { loadData(); render(); }, 3000);
}

// Heartbeat
var hb = null;
channel.addEventListener('message', function(e) {
  if (e.data && e.data.type==='heartbeat') {
    clearTimeout(hb);
    hb = setTimeout(function() { byId('stText').textContent='主页已关闭'; byId('stDot').className='p-status-dot stale'; }, 5000);
  }
  if (e.data && e.data.type==='theme-changed') applyTheme(e.data.theme);
});

// Theme
var TK = 'ptcg-theme';
function getTheme() { return localStorage.getItem(TK) || 'light'; }
function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
window.addEventListener('storage', function(e) { if (e.key===TK) applyTheme(e.newValue||'light'); });
// 对局历史事件委托：点击对手进入编辑，选择下拉框自动保存，点击取消退出，点击先后手编辑/保存
byId('historyList').addEventListener('click', function(e) {
  var target = e.target;
  var resEl = target.closest('[data-res]');
  if (resEl) {
    e.stopPropagation();
    popSetResult(resEl.getAttribute('data-res-id'), resEl.getAttribute('data-res'));
    return;
  }
  var delEl = target.closest('[data-del]');
  if (delEl) {
    e.stopPropagation();
    popDeleteEntry(delEl.getAttribute('data-del'));
    return;
  }
  var oppEl = target.closest('.hist-opp, .hist-opp-placeholder, .hist-delta[data-opp-id]');
  if (oppEl) {
    var id = oppEl.getAttribute('data-id') || oppEl.getAttribute('data-opp-id');
    if (id) { e.stopPropagation(); editPopOpp(id); }
    return;
  }
  var cancelEl = target.closest('.hist-btn-mini[data-cancel]');
  if (cancelEl) {
    e.stopPropagation();
    cancelPopOpp();
    return;
  }
  var turnEl = target.closest('.hist-btn-turn');
  if (turnEl) {
    e.stopPropagation();
    var id = turnEl.getAttribute('data-turn-id');
    var turn = turnEl.getAttribute('data-turn');
    if (!id) return;
    if (turn) {
      savePopTurn(id, turn);
    } else {
      editPopTurn(id);
    }
    return;
  }
});
byId('historyList').addEventListener('change', function(e) {
  var selEl = e.target.closest('.hist-opp-select');
  if (selEl) {
    var id = selEl.getAttribute('data-id');
    if (id) savePopOpp(id, selEl.value);
  }
});

applyTheme(getTheme());
loadData();
render();
</script>
</body>
</html>
